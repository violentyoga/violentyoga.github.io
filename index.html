  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a7e8ff86-17bb-4af5-9da5-78f727cdfd7e\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  @font-face { font-family: 'sys'; src: local('Helvetica'); }\n  @keyframes pulseSun {\n    0%, 100% { filter: drop-shadow(0 0 40px rgba(255,120,180,0.55)) drop-shadow(0 0 80px rgba(255,80,140,0.35)); }\n    50% { filter: drop-shadow(0 0 60px rgba(255,150,200,0.75)) drop-shadow(0 0 110px rgba(255,100,160,0.5)); }\n  }\n  @keyframes gridScroll {\n    0% { background-position-y: 0px; }\n    100% { background-position-y: 60px; }\n  }\n  @keyframes twinkle {\n    0%, 100% { opacity: 0.25; }\n    50% { opacity: 1; }\n  }\n  @keyframes flicker {\n    0%, 96%, 100% { opacity: 1; }\n    97% { opacity: 0.85; }\n    98% { opacity: 1; }\n    99% { opacity: 0.9; }\n  }\n  @keyframes titleGlow {\n    0%, 100% { text-shadow: 0 0 18px rgba(255,140,190,0.8), 0 0 46px rgba(255,90,180,0.5), 0 0 90px rgba(180,80,255,0.35); }\n    50% { text-shadow: 0 0 26px rgba(255,170,210,0.95), 0 0 60px rgba(255,110,190,0.65), 0 0 120px rgba(190,100,255,0.45); }\n  }\n  body { margin: 0; }\n  a { color: inherit; text-decoration: none; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:relative; width:100%; height:100vh; min-height:640px; overflow:hidden; background:linear-gradient(180deg, #0a0416 0%, #1a0a2e 22%, #3a0f4a 42%, #6e1660 58%, #b3255a 72%, #e8543f 84%, #f7943a 92%, #ffb85c 100%); font-family: Helvetica, Arial, sans-serif;\">\n\n  <!-- stars -->\n  <sc-for list=\"{{ stars }}\" as=\"s\" hint-placeholder-count=\"0\">\n    <div style=\"position:absolute; left:{{ s.x }}%; top:{{ s.y }}%; width:{{ s.size }}px; height:{{ s.size }}px; border-radius:50%; background:#fff; opacity:0.6; animation: twinkle {{ s.dur }}s ease-in-out infinite; animation-delay:{{ s.delay }}s; pointer-events:none;\"><\u002Fdiv>\n  <\u002Fsc-for>\n\n  <!-- sun -->\n  <div style=\"position:absolute; left:50%; top:30%; width:420px; height:420px; transform:translate(-50%,-50%); border-radius:50%; overflow:hidden; background:linear-gradient(180deg, #fff2c4 0%, #ffcf6b 18%, #ff9e5e 36%, #ff6f8f 54%, #e356a8 72%, #a83fc4 88%, #6a2fc9 100%); animation: pulseSun 5s ease-in-out infinite;\">\n    <div style=\"position:absolute; inset:0; background:repeating-linear-gradient(180deg, transparent 0px, transparent 14px, #1a0a2e 14px, #1a0a2e 20px); mask-image: linear-gradient(180deg, transparent 0%, transparent 46%, black 50%, black 100%); -webkit-mask-image: linear-gradient(180deg, transparent 0%, transparent 46%, black 50%, black 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- perspective grid -->\n  <div style=\"position:absolute; left:0; right:0; bottom:0; height:46%; overflow:hidden; perspective:300px; perspective-origin:50% 0%;\">\n    <div style=\"position:absolute; left:-50%; right:-50%; bottom:0; height:200%; background-image: repeating-linear-gradient(90deg, rgba(255,110,190,0.55) 0px, rgba(255,110,190,0.55) 2px, transparent 2px, transparent 60px), repeating-linear-gradient(0deg, rgba(120,230,255,0.5) 0px, rgba(120,230,255,0.5) 2px, transparent 2px, transparent 60px); background-size: 60px 60px; transform: rotateX(72deg); transform-origin: 50% 0%; animation: gridScroll 2.4s linear infinite;\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:0; right:0; bottom:38%; height:10%; background:linear-gradient(180deg, rgba(232,84,63,0), rgba(20,6,20,0.9)); pointer-events:none;\"><\u002Fdiv>\n\n  <!-- city skyline with hidden repo links -->\n  <div style=\"position:absolute; left:0; right:0; bottom:0; height:40%; display:flex; align-items:flex-end; justify-content:center; gap:18px; padding:0 6% 0 6%;\">\n    <sc-for list=\"{{ buildings }}\" as=\"b\" hint-placeholder-count=\"6\">\n      <a href=\"{{ b.url }}\" target=\"_blank\" rel=\"noopener\" title=\"{{ b.name }}\" style=\"position:relative; display:block; width:{{ b.width }}px; height:{{ b.height }}%; background:linear-gradient(180deg, #150a24 0%, #0c0616 100%); border-top:2px solid {{ b.color }}; box-shadow: 0 0 18px {{ b.color }}, inset 0 0 30px rgba(0,0,0,0.6); clip-path:{{ b.clip }};\" style-hover=\"filter:brightness(1.6); transform:translateY(-4px);\">\n        <sc-for list=\"{{ b.windows }}\" as=\"w\" hint-placeholder-count=\"0\">\n          <div style=\"position:absolute; left:{{ w.x }}%; top:{{ w.y }}%; width:6px; height:6px; background:{{ b.color }}; opacity:0.85; animation: flicker {{ w.dur }}s infinite;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- scanline overlay -->\n  <div style=\"position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(180deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px); mix-blend-mode:overlay; opacity:0.5;\"><\u002Fdiv>\n  <div style=\"position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 160px 40px rgba(10,4,20,0.85);\"><\u002Fdiv>\n\n  <!-- title -->\n  <div style=\"position:absolute; top:9%; left:50%; transform:translateX(-50%); text-align:center; z-index:5;\">\n    <div style=\"font-size:clamp(40px,8vw,96px); font-weight:800; letter-spacing:0.12em; color:#fff0f7; animation: titleGlow 4s ease-in-out infinite; text-transform:uppercase;\">Violent Yoga<\u002Fdiv>\n    <div style=\"margin-top:10px; font-size:16px; letter-spacing:0.5em; color:rgba(255,230,245,0.75); text-transform:uppercase;\">code &amp; discipline<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const stars = [];\n    let seed = 42;\n    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };\n    for (let i = 0; i < 90; i++) {\n      stars.push({\n        x: +(rand() * 100).toFixed(1),\n        y: +(rand() * 34).toFixed(1),\n        size: 1 + Math.round(rand() * 2),\n        dur: +(2 + rand() * 3).toFixed(1),\n        delay: +(rand() * 4).toFixed(1)\n      });\n    }\n\n    const repos = [\n      { name: 'risotto', url: 'https://github.com/violentyoga/risotto', color: '#ff7ab8' },\n      { name: 'readable', url: 'https://github.com/violentyoga/readable', color: '#ffd27a' },\n      { name: 'punk77', url: 'https://github.com/violentyoga/punk77', color: '#7af7ff' },\n      { name: 'plaintxt', url: 'https://github.com/violentyoga/plaintxt', color: '#c17aff' },\n      { name: 'cairn', url: 'https://github.com/violentyoga/cairn', color: '#ff9a5c' },\n      { name: 'daemon-atlas', url: 'https://github.com/violentyoga/daemon-atlas', color: '#7affa0' }\n    ];\n    const heights = [55, 78, 42, 90, 60, 70];\n    const widths = [70, 60, 90, 50, 80, 65];\n    const clips = [\n      'polygon(0 0, 100% 0, 100% 100%, 0 100%)',\n      'polygon(0 10%, 100% 0, 100% 100%, 0 100%)',\n      'polygon(0 0, 60% 0, 100% 12%, 100% 100%, 0 100%)',\n      'polygon(0 6%, 100% 0, 100% 100%, 0 100%)',\n      'polygon(0 0, 100% 8%, 100% 100%, 0 100%)',\n      'polygon(0 8%, 50% 0, 100% 8%, 100% 100%, 0 100%)'\n    ];\n\n    const buildings = repos.map((r, i) => {\n      const windows = [];\n      let ws = i * 17 + 3;\n      const wr = () => { ws = (ws * 9301 + 49297) % 233280; return ws / 233280; };\n      const cols = 2 + Math.round(wr() * 2);\n      const rows = 3 + Math.round(wr() * 4);\n      for (let c = 0; c < cols; c++) {\n        for (let rIdx = 0; rIdx < rows; rIdx++) {\n          if (wr() > 0.4) {\n            windows.push({\n              x: 12 + c * (70 / cols),\n              y: 10 + rIdx * (80 / rows),\n              dur: +(2 + wr() * 4).toFixed(1)\n            });\n          }\n        }\n      }\n      return {\n        name: r.name,\n        url: r.url,\n        color: r.color,\n        height: heights[i],\n        width: widths[i],\n        clip: clips[i],\n        windows\n      };\n    });\n\n    return { stars, buildings };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
